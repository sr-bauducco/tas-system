server:
  port: 8084

spring:
  application:
    name: ms-emergency

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info

info:
  app:
    name: "TAS Emergency Service"
    description: "GoalD Emergency Notification Subsystem"

logging:
  level:
    agent: DEBUG
    org.springframework.web: INFO

eureka:
  client:
    serviceUrl:
      defaultZone: http://ms-registry:8761/eureka/